let currentAmbient=0,currentCategory="ALL",modalProduct=null,selectedFormat=null;
function trackEvent(n,p={}){if(typeof gtag==="function")gtag("event",n,p)}
const formatUSD=p=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(p);
function createAmbientSlides(){
 const s=document.getElementById("ambientSlides"),d=document.getElementById("ambientDots");
 s.innerHTML="";d.innerHTML="";
 const feature={image:"entregandoarte.jpg",title:"TAKE HOME A PIECE OF THE STORY",subtitle:"Choose your format · Fine Art · Canvas · Chassi · Framed Edition · Original + NFT"};
 const waves=products.find(p=>p.name.toLowerCase().includes("waves"));
 const others=products.filter(p=>p.ambientImage && (!waves || p.id!==waves.id));
 const slides=[feature,...(waves?[waves]:[]),...others];
 slides.forEach((p,i)=>{
   const x=document.createElement("div");x.className="ambient-slide"+(i?"":" active");
   x.innerHTML=`<img src="${p.image||p.ambientImage}" alt="${p.title||p.name}" onerror="this.style.display='none'">`;s.appendChild(x);
   const dot=document.createElement("div");dot.className="ambient-dot"+(i?"":" active");d.appendChild(dot);
 });
 currentAmbient=0;updateAmbientText();
}
function showAmbient(i){
 const s=document.querySelectorAll(".ambient-slide"),d=document.querySelectorAll(".ambient-dot");if(!s.length)return;
 currentAmbient=(i+s.length)%s.length;s.forEach(x=>x.classList.remove("active"));d.forEach(x=>x.classList.remove("active"));s[currentAmbient].classList.add("active");d[currentAmbient].classList.add("active");updateAmbientText();
}
function updateAmbientText(){
 const feature={title:"TAKE HOME A PIECE OF THE STORY",subtitle:"Choose your format · Fine Art · Canvas · Chassi · Framed Edition · Original + NFT"};
 if(currentAmbient===0){document.getElementById("ambientTitle").textContent=feature.title;document.getElementById("ambientSubtitle").textContent=feature.subtitle;return;}
 const waves=products.find(p=>p.name.toLowerCase().includes("waves"));
 const others=products.filter(p=>p.ambientImage && (!waves || p.id!==waves.id));
 const ordered=[...(waves?[waves]:[]),...others];
 const p=ordered[currentAmbient-1];
 if(!p)return;
 document.getElementById("ambientTitle").textContent=p.name;
 document.getElementById("ambientSubtitle").textContent=p.id===6?"Five editions available · Fine Art · Canvas · Chassi · Framed · Original + NFT":p.technique;
}
setInterval(()=>showAmbient(currentAmbient+1),5500);
function productVisual(p){return `<div class="visual-layer" id="visual-${p.id}"><img src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="placeholder" style="display:none"><div class="placeholder-symbol">✦</div>ARTWORK</div></div><div class="image-switcher"><button class="active" id="artwork-button-${p.id}" onclick="showArtwork(${p.id})">ARTWORK</button><button id="space-button-${p.id}" onclick="showAmbientProduct(${p.id})">IN SPACE</button></div>`}
function showArtwork(id){const p=products.find(x=>x.id===id),v=document.getElementById("visual-"+id);v.innerHTML=`<img src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="placeholder" style="display:none"><div class="placeholder-symbol">✦</div>ARTWORK</div>`;document.getElementById("artwork-button-"+id).classList.add("active");document.getElementById("space-button-"+id).classList.remove("active");trackEvent("view_artwork",{item_id:String(p.id),item_name:p.name})}
function showAmbientProduct(id){const p=products.find(x=>x.id===id),v=document.getElementById("visual-"+id);v.innerHTML=`<img src="${p.ambientImage}" alt="${p.name} in space" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="placeholder" style="display:none"><div class="placeholder-symbol">✦</div>IN SPACE</div>`;document.getElementById("artwork-button-"+id).classList.remove("active");document.getElementById("space-button-"+id).classList.add("active");trackEvent("view_in_space",{item_id:String(p.id),item_name:p.name})}
function renderProducts(category="ALL"){
 currentCategory=category;const c=document.getElementById("productCarousel");const list=category==="ALL"?products:products.filter(p=>p.category===category);c.innerHTML="";
 list.forEach(p=>{const card=document.createElement("article");card.className="product";const lowest=p.formats[0];card.innerHTML=`<div class="product-image"><div class="badge">${p.badge}</div>${productVisual(p)}</div><div class="product-info"><div class="product-type">${p.category}</div><h2 class="product-name">${p.name}</h2><p class="product-description">${p.description}</p><div class="product-details"><span><strong>Technique:</strong> ${p.technique}</span><span><strong>Dimensions:</strong> ${p.dimensions}</span></div><div class="product-bottom"><div><div class="price-usd">FROM ${formatUSD(lowest.priceUSD)}</div><div class="price-brl">SHIPPING CALCULATED SEPARATELY</div></div><a class="buy-button" href="${p.kofi}" target="_blank" rel="noopener" onclick="trackPurchaseClick(${p.id})">BUY ON KO-FI</a></div><button class="format-button" onclick="openFormatModal(${p.id})">VIEW THE FORMAT</button><div class="format-pilot">5 EDITIONS AVAILABLE</div></div>`;c.appendChild(card)})
}
function trackPurchaseClick(id){const p=products.find(x=>x.id===id);if(p)trackEvent("click_kofi",{item_id:String(p.id),item_name:p.name,price_from_usd:p.formats[0].priceUSD})}
function openFormatModal(id){
 modalProduct=products.find(x=>x.id===id);selectedFormat=null;
 document.getElementById("modalTitle").textContent=modalProduct.name;
 document.getElementById("modalSubtitle").textContent=modalProduct.pilot?"WAVES — complete five-edition collector ladder.":"Choose the edition that feels right for your collection.";
 const list=document.getElementById("formatList");list.innerHTML="<div class='format-section-title'>SELECT YOUR EDITION</div>";
 modalProduct.formats.forEach(f=>list.insertAdjacentHTML("beforeend",`<button class="format-option" onclick="selectFormat('${f.key}',this)"><span><span class="format-name">${f.name}</span><span class="format-desc">${f.desc}</span></span><span class="format-price">${formatUSD(f.priceUSD)}</span></button>`));
 document.getElementById("selectedFormat").innerHTML="Select an edition above.";
 const mb=document.getElementById("modalBuy");mb.href=modalProduct.kofi;mb.textContent="CONTINUE TO KO-FI";
 document.querySelector(".modal-note").textContent="Prices are in USD. Shipping is calculated separately at checkout. Ko-fi manages the selected product variant.";
 document.getElementById("formatModal").classList.add("open");document.getElementById("formatModal").setAttribute("aria-hidden","false");trackEvent("open_format_selector",{item_id:String(id),item_name:modalProduct.name})
}
function selectFormat(key,el){
 document.querySelectorAll(".format-option").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");selectedFormat=modalProduct.formats.find(x=>x.key===key);
 document.getElementById("selectedFormat").innerHTML=selectedFormat?`Selected: <strong>${selectedFormat.name}</strong> · ${formatUSD(selectedFormat.priceUSD)}`:"Select an edition above.";
 trackEvent("select_format",{item_name:modalProduct.name,format:key,value_usd:selectedFormat?.priceUSD||0,currency:"USD"})
}
function closeFormatModal(){document.getElementById("formatModal").classList.remove("open");document.getElementById("formatModal").setAttribute("aria-hidden","true")}
document.getElementById("formatModal").addEventListener("click",e=>{if(e.target.id==="formatModal")closeFormatModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeFormatModal()});
document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderProducts(b.dataset.category);document.getElementById("productCarousel").scrollTo({left:0,behavior:"smooth"});trackEvent("filter_store",{category:b.dataset.category})}));
function moveCarousel(d){document.getElementById("productCarousel").scrollBy({left:d*345,behavior:"smooth"});trackEvent("carousel_navigation",{direction:d>0?"next":"previous"})}
createAmbientSlides();renderProducts();trackEvent("store_visit",{store_name:"Buda Studio Store"});
</script>
